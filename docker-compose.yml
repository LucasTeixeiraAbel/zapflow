version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zapflow_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zapflow
    ports:
      - '5432:5432'
    volumes:
      - ./infrastructure/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: zapflow_redis
    ports:
      - '6379:6379'
    volumes:
      - ./infrastructure/data/redis:/data
